services:
  postgres:
    image: postgres:15-alpine
    container_name: crjy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chengrongjieyue}
      POSTGRES_USER: ${DB_USER:-chengrongjieyue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chengrongjieyue} -d ${DB_NAME:-chengrongjieyue}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: crjy-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: crjy-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chengrongjieyue}
      DB_USER: ${DB_USER:-chengrongjieyue}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?请在 .env 中配置 ENCRYPT_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中配置 ADMIN_PASSWORD}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build: ./frontend
    container_name: crjy-frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.25-alpine
    container_name: crjy-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
